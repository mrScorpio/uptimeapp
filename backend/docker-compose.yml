services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uptimeapp
      POSTGRES_USER: uptimeapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptimeapp -d uptimeapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
